<!--
  Logo da Arrecife Ateliê
  Símbolo: o sol nascendo sobre o mar (amarelo), as ondas da maré (azul)
  e a linha de pedra do arrecife (coral) que deu nome à cidade do Recife.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-labelledby="t">
  <title id="t">Arrecife Ateliê</title>
  <!-- Símbolo -->
  <g transform="translate(10 10)">
    <circle cx="50" cy="50" r="50" fill="#F4EBDD"/>
    <path d="M22 54 a28 28 0 0 1 56 0 Z" fill="#F2B134"/>
    <path d="M14 62 q9 -7 18 0 t18 0 t18 0 t18 0" fill="none" stroke="#1B3A4B" stroke-width="5" stroke-linecap="round"/>
    <path d="M14 74 q9 -7 18 0 t18 0 t18 0 t18 0" fill="none" stroke="#1B3A4B" stroke-width="5" stroke-linecap="round"/>
    <rect x="20" y="82" width="60" height="7" rx="3.5" fill="#E2725B"/>
  </g>
  <!-- Logotipo -->
  <text x="128" y="66" font-family="Fraunces, Georgia, serif" font-size="50" font-style="italic" font-weight="600" fill="#1B3A4B">arrecife</text>
  <text x="131" y="96" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="6" fill="#E2725B">ATELIÊ · RECIFE</text>
</svg>
